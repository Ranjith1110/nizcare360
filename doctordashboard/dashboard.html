<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <!-- Sidebar will be loaded here -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center border-bottom-nav py-2">
                <h1 class="opacity-0 d-none d-lg-block">Welcome to the Dashboard</h1>
                <div class="d-flex align-items-center gap-4">
                    <img width="35px" class="d-none d-lg-block" src="https://flagcdn.com/in.svg" alt="">
                    <div class="dropdown d-none d-lg-block">
                        <a href="#" class="dropdown-toggle text-decoration-none text-secondary" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa fa-user-md fs-5"></i>
                        </a>
                        <ul class="dropdown-menu mt-2">
                            <li><a class="dropdown-item" href="#">Doctor Dashboard</a></li>
                            <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- First Section -->
            <div class="container mt-0 mt-lg-4 p-0 p-lg-4">
                <div class="row">
                    <div class="col-lg-4">
                        <div class="card mb-4 border-0 shadow-lg" style=" border-radius: 1.5rem;">
                            <div class="card-body d-flex align-items-center justify-content-between py-4">
                                <div>
                                    <div class="mb-2">
                                        <span
                                            class="badge bg-warning text-white fw-semibold px-3 py-2 rounded-pill fs-6">
                                            <i class="fa-solid fa-hospital-user me-2"></i>
                                            Total Patients
                                        </span>
                                    </div>
                                    <div class="fs-1 fw-bold text-dark">150</div>
                                    <div class="text-muted small mt-1">as of today</div>
                                </div>
                                <div>
                                    <div class="bg-white rounded-circle shadow d-flex align-items-center justify-content-center"
                                        style="width:70px; height:70px;">
                                        <i class="fa-solid fa-heart-pulse fa-2x text-warning"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashboard Header -->
            <div class="dashboard-header">
                <h1><i class="fas fa-heartbeat mt-4"></i> Doctor Dashboard</h1>
                <p>Switch views to see trends by date, month, or year and understand the health engagement patterns</p>
                <div class="custom-toggle-group" role="group">
                    <input type="radio" id="optionDate" name="options" class="custom-toggle-radio" checked>
                    <label for="optionDate" class="custom-toggle-btn">Date</label>

                    <input type="radio" id="optionMonth" name="options" class="custom-toggle-radio">
                    <label for="optionMonth" class="custom-toggle-btn">Month</label>

                    <input type="radio" id="optionYear" name="options" class="custom-toggle-radio">
                    <label for="optionYear" class="custom-toggle-btn">Year</label>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-container row">
                <div class="chart-card col-lg-12 col-md-12 mb-4 bg-light">
                    <div class="chart-title">Visits Over Time</div>
                    <div class="chart-wrapper">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/script.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
