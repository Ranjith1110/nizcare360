<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">

</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar position-fixed overflow-y-auto">
        <div class="p-4 border-bottom-nav mb-4">
            <!-- <img src="assets/policynation-logo.svg" alt="Logo" width="195" /> -->
            <i class="fa fa-user-doctor fs-1 me-2"></i>
            Doctor Dashboard
        </div>

        <!-- Parent wrapper for accordion behavior -->
        <div id="sidebarAccordion">

            <a href="#" class="d-flex align-items-center gap-2"><i class="fa fa-user fs-5"></i> Dashboard</a>
            <a href="#" class="d-flex align-items-center gap-2"><i class="fa fa-user fs-5"></i>Assigned
                Tele-consultations</a>
            <a href="#" class="d-flex align-items-center gap-2"><i class="fa fa-user fs-5"></i> Walkin patients</a>

            <!--  Patients -->
            <a class="d-flex align-items-center justify-content-between" data-bs-toggle="collapse"
                href="#radiologySubmenu" role="button" aria-expanded="false" aria-controls="radiologySubmenu">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa fa-user fs-5"></i>
                    Patients
                </div>
                <i class="fa-solid fa-angle-down arrow-icon"></i>
            </a>
            <div class="collapse ps-3" id="radiologySubmenu" data-bs-parent="#sidebarAccordion">
                <a href="#">Add New</a>
                <a href="#">View all</a>
            </div>

            <!-- Dependents -->
            <a class="d-flex align-items-center justify-content-between" data-bs-toggle="collapse"
                href="#dependentsSubmenu" role="button" aria-expanded="false" aria-controls="dependentsSubmenu">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa fa-user fs-5"></i>
                    Clnic ToDo
                </div>
                <i class="fa-solid fa-angle-down arrow-icon"></i>
            </a>
            <div class="collapse ps-3" id="dependentsSubmenu" data-bs-parent="#sidebarAccordion">
                <a href="#">Add Event</a>
                <a href="#">Event List</a>
                <a href="#">VIew ToDo</a>
            </div>

            <!-- Diabetes Management Plans -->
            <a class="d-flex align-items-center justify-content-between" data-bs-toggle="collapse"
                href="#diabetesSubmenu" role="button" aria-expanded="false" aria-controls="diabetesSubmenu">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa fa-user fs-5"></i>
                    Inclinic Labs
                </div>
                <i class="fa-solid fa-angle-down arrow-icon"></i>
            </a>
            <div class="collapse ps-3" id="diabetesSubmenu" data-bs-parent="#sidebarAccordion">
                <a href="#">View Inclinic Labs</a>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- sidebar for sm/md only -->
    <nav class="navbar navbar-dark d-lg-none">
        <div class="container-fluid d-flex justify-content-between align-items-center border-bottom py-3">
            <a class="navbar-brand" href="#">
                <!-- <img src="assets/images/in.jpg" alt="Logo" width="100" /> -->
            </a>
            <div class="d-flex align-items-center">
                <!-- Country Flag -->
                <img width="35" src="https://flagcdn.com/in.svg" alt="India Flag" class="shadow-sm" />

                <!-- User Dropdown -->
                <div class="dropdown ms-3">
                    <a href="#" class="dropdown-toggle text-decoration-none text-secondary" id="userDropdown"
                        role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa fa-user-md fs-5"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end mt-2" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="#">Doctor Dashboard</a></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                    </ul>
                </div>

                <!-- Sidebar Toggle Button -->
                <button class="btn btn-outline-light" id="toggleBtn" type="button" aria-label="Open sidebar">
                    <span class="fs-4 bg-black py-1 px-2 rounded">☰</span>
                </button>
            </div>
        </div>
    </nav>

    <script src="assets/script.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
