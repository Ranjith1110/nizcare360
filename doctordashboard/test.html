<style>
/* Dropdown container */
.custom-dropdown {
  position: relative;
  display: inline-block;
}

/* Dropdown toggle button */
.custom-dropdown-btn {
  padding: 0.375rem 1rem;
  font-size: 0.95rem;
  border-radius: 999px;
  border: 1.5px solid #1da69a;
  background: #fff;
  color: #1da69a;
  cursor: pointer;
  outline: none;
  transition: background 0.2s, color 0.2s, border 0.2s;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.custom-dropdown-btn:focus,
.custom-dropdown-btn.active {
  background: #1da69a;
  color: #fff;
  border-color: #1da69a;
}

/* Dropdown menu */
.custom-dropdown-menu {
  display: none;
  position: absolute;
  top: 110%;
  right: 0;
  min-width: 180px;
  background: #fff;
  border: 1.5px solid #e0f2f1;
  border-radius: 1rem;
  box-shadow: 0 8px 24px rgba(29,166,154,0.13);
  z-index: 1000;
  padding: 0.5rem 0;
}

.custom-dropdown.open .custom-dropdown-menu {
  display: block;
  animation: fadeIn 0.2s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px);}
  to { opacity: 1; transform: translateY(0);}
}

/* Dropdown item */
.custom-dropdown-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 1.25rem;
  color: #333;
  text-decoration: none;
  background: none;
  border: none;
  width: 100%;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.18s, color 0.18s;
}

.custom-dropdown-item:hover {
  background: #e0f7fa;
  color: #1da69a;
}

.custom-dropdown-item i {
  min-width: 1.1em;
  text-align: center;
}
</style>

<!-- Dropdown HTML -->
<div class="custom-dropdown" tabindex="0">
  <button type="button" class="custom-dropdown-btn" onclick="toggleDropdown(this)">
    Action <i class="fa fa-caret-down"></i>
  </button>
  <div class="custom-dropdown-menu">
    <button class="custom-dropdown-item" type="button">
      <i class="fa fa-video text-primary"></i> Join Meeting
    </button>
    <button class="custom-dropdown-item" type="button">
      <i class="fa fa-info-circle text-info"></i> View Details
    </button>
  </div>
</div>

<script>
function toggleDropdown(btn) {
  // Close any other open dropdowns
  document.querySelectorAll('.custom-dropdown.open').forEach(d => {
    if (d !== btn.parentElement) d.classList.remove('open');
  });
  // Toggle this dropdown
  btn.parentElement.classList.toggle('open');
}

// Close dropdown if clicked outside
document.addEventListener('click', function(e) {
  document.querySelectorAll('.custom-dropdown.open').forEach(d => {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
});

// Optional: close dropdown on ESC
document.addEventListener('keydown', function(e) {
  if (e.key === "Escape") {
    document.querySelectorAll('.custom-dropdown.open').forEach(d => d.classList.remove('open'));
  }
});
</script>
