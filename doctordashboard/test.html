<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line and Doughnut Chart Example</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Luxon and Chart.js adapter for time scale -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

  <style>
    body {
      background: #f9fafb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto 3rem;
      background: #fff;
      padding: 1.5rem 2rem 2rem 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgb(0 0 0 / 0.05);
    }
    .btn-group-toggle .btn {
      border-radius: 8px;
      font-weight: 600;
      min-width: 70px;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      background-color: #f3f4f6;
      transition: background-color 0.3s, color 0.3s;
    }
    .btn-group-toggle .btn.active {
      background-color: #4f46e5;
      color: white;
      border-color: #4f46e5;
      box-shadow: 0 4px 15px rgb(79 70 229 / 0.3);
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 40%; /* Aspect ratio 5:2 */
      margin-top: 1rem;
    }
    .chart-wrapper canvas {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<div class="chart-container">
  <div class="d-flex justify-content-end mb-3">
    <div class="btn-group btn-group-toggle" role="group" aria-label="Toggle date range">
      <input type="radio" class="btn-check" name="options" id="optionDate" autocomplete="off" checked />
      <label class="btn btn-outline-primary active" for="optionDate">Date</label>

      <input type="radio" class="btn-check" name="options" id="optionMonth" autocomplete="off" />
      <label class="btn btn-outline-primary" for="optionMonth">Month</label>

      <input type="radio" class="btn-check" name="options" id="optionYear" autocomplete="off" />
      <label class="btn btn-outline-primary" for="optionYear">Year</label>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas id="lineChart"></canvas>
  </div>
</div>

<div class="chart-container" style="max-width: 400px;">
  <canvas id="doughnutChart"></canvas>
</div>

<script>
  // Sample datasets for line chart by granularity
  const dataSets = {
    date: {
      labels: Array.from({length: 31}, (_, i) => `2025-07-${String(i+1).padStart(2,'0')}`),
      datasets: [
        {
          label: 'Walkin',
          data: [12, 15, 13, 18, 20, 22, 17, 15, 14, 16, 18, 21, 19, 20, 22, 23, 21, 19, 18, 16, 17, 15, 14, 13, 12, 15, 17, 19, 20, 18, 16],
          borderColor: '#1da69a',
          backgroundColor: 'rgba(29,166,154,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
        },
        {
          label: 'Treatment',
          data: [5, 6, 7, 6, 8, 9, 7, 6, 5, 7, 8, 9, 7, 8, 9, 10, 8, 7, 6, 5, 6, 7, 6, 5, 7, 8, 9, 10, 11, 9, 7],
          borderColor: '#f87171',
          backgroundColor: 'rgba(248,113,113,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
        },
        {
          label: 'Others',
          data: [3, 4, 3, 5, 6, 7, 5, 4, 3, 4, 5, 6, 5, 6, 7, 8, 6, 5, 4, 3, 4, 5, 4, 3, 4, 5, 6, 7, 8, 6, 5],
          borderColor: '#ffc107',
          backgroundColor: 'rgba(255,193,7,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
        }
      ]
    },
    month: {
      labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
      datasets: [
        {
          label: 'Walkin',
          data: [120, 150, 130, 180, 200, 220, 170, 160, 140, 150, 160, 170],
          borderColor: '#1da69a',
          backgroundColor: 'rgba(29,166,154,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
        },
        {
          label: 'Treatment',
          data: [50, 60, 70, 60, 80, 90, 70, 60, 50, 70, 80, 90],
          borderColor: '#f87171',
          backgroundColor: 'rgba(248,113,113,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
        },
        {
          label: 'Others',
          data: [30, 40, 30, 50, 60, 70, 50, 40, 30, 40, 50, 60],
          borderColor: '#ffc107',
          backgroundColor: 'rgba(255,193,7,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
        }
      ]
    },
    year: {
      labels: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025'],
      datasets: [
        {
          label: 'Walkin',
          data: [1200, 1500, 1300, 1800, 2000, 2200, 1700, 1600],
          borderColor: '#1da69a',
          backgroundColor: 'rgba(29,166,154,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 6,
        },
        {
          label: 'Treatment',
          data: [500, 600, 700, 600, 800, 900, 700, 600],
          borderColor: '#f87171',
          backgroundColor: 'rgba(248,113,113,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 6,
        },
        {
          label: 'Others',
          data: [300, 400, 300, 500, 600, 700, 500, 400],
          borderColor: '#ffc107',
          backgroundColor: 'rgba(255,193,7,0.2)',
          fill: true,
          tension: 0.3,
          pointRadius: 6,
        }
      ]
    }
  };

  // Initial chart config
  const config = {
    type: 'line',
    data: dataSets.date,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
          time: {
            unit: 'day',
            tooltipFormat: 'DD MMM yyyy',
            displayFormats: {
              day: 'dd MMM',
              month: 'MMM yyyy',
              year: 'yyyy'
            }
          },
          title: {
            display: true,
            text: 'Date'
          }
        },
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Count'
          }
        }
      },
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { mode: 'index', intersect: false },
      },
      interaction: { mode: 'nearest', intersect: false }
    }
  };

  const ctx = document.getElementById('lineChart').getContext('2d');
  let lineChart = new Chart(ctx, config);

  // Toggle buttons logic
  const radios = document.querySelectorAll('input[name="options"]');
  radios.forEach(radio => {
    radio.addEventListener('change', () => {
      if (!radio.checked) return;

      let selected = radio.id.replace('option', '').toLowerCase();

      // Update data and x-axis config based on selection
      lineChart.data = dataSets[selected];

      // Update x-axis time unit and title
      lineChart.options.scales.x.time.unit = selected === 'date' ? 'day' : selected === 'month' ? 'month' : 'year';
      lineChart.options.scales.x.title.text = selected === 'date' ? 'Date' : selected === 'month' ? 'Month' : 'Year';

      // Update tooltip format accordingly
      lineChart.options.scales.x.time.tooltipFormat = selected === 'date' ? 'DD MMM yyyy' : selected === 'month' ? 'MMM yyyy' : 'yyyy';

      lineChart.update();
    });
  });

  // Doughnut chart data and config
  const donutCtx = document.getElementById('doughnutChart').getContext('2d');
  const donutChart = new Chart(donutCtx, {
    type: 'doughnut',
    data: {
      labels: ['Walkin', 'Treatment', 'Others'],
      datasets: [{
        label: 'Patient Distribution',
        data: [30, 50, 20],
        backgroundColor: ['#1da69a', '#f87171', '#ffc107'],
        hoverOffset: 30,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { enabled: true },
      },
    }
  });
</script>

</body>
</html>
