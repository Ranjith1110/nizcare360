<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
    <div class="row gy-5">
        <div class="col-lg-12">
            <div class="form-container p-4 rounded shadow-lg">
                <h3 class="mb-4 fw-bold text-center">SCHEDULE DEMO</h3>
                <form>
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="companyName" class="form-label fw-semibold">Company Name</label>
                                <input type="text" class="form-control input-field" id="companyName" placeholder="">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="hrName" class="form-label fw-semibold">HR SPOC Name</label>
                                <input type="text" class="form-control input-field" id="hrName" placeholder="">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="city" class="form-label fw-semibold">City</label>
                                <input type="text" class="form-control input-field" id="city" placeholder="">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
                                <input type="tel" class="form-control input-field" id="mobile" placeholder="">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control input-field" id="email" placeholder="">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="employees" class="form-label fw-semibold">Number of
                                    Employees</label>
                                <input type="number" class="form-control input-field" id="employees" placeholder="">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="sector" class="form-label fw-semibold">Select Sector</label>
                        <select class="form-select input-field" id="sector">
                            <option value="">Select</option>
                            <option value="Cement">Cement</option>
                            <option value="Fertilizer">Fertilizer</option>
                            <option value="Food processing">Food processing</option>
                            <option value="Steel">Steel</option>
                            <option value="Pharma">Pharma</option>
                            <option value="Hotels">Hotels</option>
                            <option value="Banks">Banks</option>
                            <option value="Airlines">Airlines</option>
                            <option value="Leather Industry">Leather Industry</option>
                            <option value="Heavy Industry">Heavy Industry</option>
                            <option value="Cottage">Cottage</option>
                            <option value="Chemical">Chemical</option>
                            <option value="Mining">Mining</option>
                            <option value="Textile">Textile</option>
                            <option value="Automobile">Automobile</option>
                            <option value="ITES">ITES</option>
                            <option value="Aerospace & Defense">Aerospace & Defense</option>
                            <option value="Metals">Metals</option>
                            <option value="Petroleum Industry">Petroleum Industry</option>
                            <option value="Telecommunication">Telecommunication</option>
                            <option value="Ports, Shipping & Maritime">Ports, Shipping & Maritime</option>
                            <option value="Water Treatment & Sanitation Services">Water Treatment & Sanitation
                                Services</option>
                            <option value="Dairy & Livestock Industry">Dairy & Livestock Industry</option>
                            <option value="Tourism & Travel">Tourism & Travel</option>
                            <option value="Paper">Paper</option>
                            <option value="Real Estate Tech">Real Estate Tech</option>
                            <option value="Sports Industry">Sports Industry</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="wellnessService" class="form-label fw-semibold">Currently Using Any Wellness
                            Service</label>
                        <select class="form-select input-field" id="wellnessService">
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="features" class="form-label fw-semibold">Features Expecting</label>
                        <textarea class="form-control input-field" id="features" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="anythingElse" class="form-label fw-semibold">Anything Else</label>
                        <textarea class="form-control input-field" id="anythingElse" rows="3"></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="w-50 py-3 fs-6 btn-form">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
