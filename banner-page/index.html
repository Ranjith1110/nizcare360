<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <section id="hero" class="hero d-flex align-items-center justify-content-center">
        <!-- Responsive hero background -->
        <picture>
            <!-- Mobile -->
            <source srcset="responsive-banner.png" media="(max-width: 575px)">
            <!-- Desktop -->
            <img src="vinith.website banner nizcare(1).png" alt="Hero banner" class="hero-bg" data-aos="fade-in">
        </picture>

        <div class="container">
            <div class="row">
                <div class="col-lg-5">
                    <div class="hero-text-wrapper">
                        <h2>
                            <span id="firstLine" class="typewriter"></span><br>
                            <!-- <span id="restLine" style="display:none;">Health and Wellness Destination</span> -->
                        </h2>
                    </div>
                    <button class="hero-btn">Request Demo</button>
                </div>

                <div class="col-lg-7">
                    <div class="sector-wrapper">
                        <div class="sector-circle">
                            <div class="sector-center">
                                <div class="sector-center-circle">
                                    <p class="sector-count mt-4">
                                        <span class="d-block text-center">28+</span>
                                        <span class="d-block sector-label">Sectors</span>
                                    </p>
                                </div>
                            </div>
                            <div class="sector-outline circle1"></div>
                            <div class="sector-outline circle2"></div>
                            <div class="sector-outline circle3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // typewriter effect
        const firstLineText = "India's Leading Health and Wellness Destination";
        const restLine = document.getElementById("restLine");
        const firstLine = document.getElementById("firstLine");
        let i = 0;

        function typeEffect() {
            if (i < firstLineText.length) {
                firstLine.textContent += firstLineText.charAt(i);
                i++;
                setTimeout(typeEffect, 100); // typing speed
            } else {
                // stop cursor blinking
                firstLine.classList.remove("typewriter");
                // show rest of text instantly
                restLine.style.display = "inline";
            }
        }

        window.onload = typeEffect;


        const sectors = [
            { name: 'Cement' },
            { name: 'Fertilizer' },
            { name: 'Automobile' },
            { name: 'Pharma' },
            { name: 'Hotels' },
            { name: 'IT' },
            { name: 'Banks' },
            { name: 'Airlines' },
            { name: 'Leather' },
            { name: 'Cottage' },
            { name: 'Chemical' },
            { name: 'Mining' },
            { name: 'Heavy' },
            { name: 'Textile' },
            { name: 'ITES' },
            { name: 'Food' },
            { name: 'Port' },
            { name: 'Petroleum' },
            { name: 'Telecom' },
            { name: 'Water Treatment' },
            { name: 'Dairy' },
            { name: 'Tourism' },
            { name: 'Steel' },
            { name: 'Aerospace' },
            { name: 'Paper' },
            { name: 'Real Estate' },
            { name: 'Sports' },
            { name: 'Metals' },
        ];

        // Define 3 rings
        const circles = [
            { items: sectors.slice(0, 7), radiusRatio: 0.20, speed: 0.35 },
            { items: sectors.slice(7, 16), radiusRatio: 0.32, speed: -0.25 },
            { items: sectors.slice(16, 28), radiusRatio: 0.46, speed: 0.18 },
        ];

        let rotationAngles = [0, 0, 0];
        let dragInfo = { isDragging: false, startX: 0, lastRotation: [], circleIndex: null };

        const circleContainer = document.querySelector('.sector-circle');

        // Create elements
        circles.forEach((circle, circleIndex) => {
            circle.items.forEach((sector, i) => {
                const div = document.createElement('div');
                div.className = 'sector-item';
                div.textContent = sector.name;

                div.addEventListener('mousedown', e => onDragStart(e, circleIndex));
                div.addEventListener('mousemove', e => onDragMove(e));
                div.addEventListener('mouseup', e => onDragEnd(e, sector.route));
                div.addEventListener('mouseleave', e => onDragEnd(e));

                div.addEventListener('touchstart', e => onDragStart(e, circleIndex));
                div.addEventListener('touchmove', e => onDragMove(e));
                div.addEventListener('touchend', e => onDragEnd(e, sector.route));

                circleContainer.appendChild(div);
                circle.items[i].el = div;
            });
        });

        // Animation loop
        function animate() {
            const size = circleContainer.offsetWidth;

            circles.forEach((circle, circleIndex) => {
                if (!dragInfo.isDragging || dragInfo.circleIndex !== circleIndex) {
                    rotationAngles[circleIndex] = (rotationAngles[circleIndex] + circle.speed) % 360;
                }

                const radius = size * circle.radiusRatio;
                circle.items.forEach((sector, i) => {
                    const angle = (i / circle.items.length) * 2 * Math.PI + (rotationAngles[circleIndex] * Math.PI) / 180;
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    sector.el.style.left = `calc(50% + ${x}px)`;
                    sector.el.style.top = `calc(50% + ${y}px)`;
                });
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Drag logic
        function onDragStart(e, circleIndex) {
            e.preventDefault();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            dragInfo = {
                isDragging: true,
                startX: clientX,
                lastRotation: [...rotationAngles],
                circleIndex,
            };
        }
        function onDragMove(e) {
            if (!dragInfo.isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const deltaX = clientX - dragInfo.startX;
            const speedFactor = 1.5;
            const newRotations = [...dragInfo.lastRotation];
            newRotations[dragInfo.circleIndex] = (newRotations[dragInfo.circleIndex] + deltaX * speedFactor) % 360;
            rotationAngles = newRotations;
        }
        function onDragEnd(e, route) {
            if (!dragInfo.isDragging) return;
            if (route && Math.abs((e.clientX || 0) - dragInfo.startX) < 4) {
                window.location.href = route;
            }
            dragInfo.isDragging = false;
        }
    </script>
</body>

</html>
